build_site:
  stage: build
  image: python:3.13-slim
  before_script:
    - python -m pip install --no-cache-dir -r requirements.txt
  script:
    - make build
  artifacts:
    paths:
      - build/
    expire_in: 1 week

deploy_pages:
  stage: deploy
  image: alpine:3.21
  before_script: []
  needs:
    - job: build_site
      artifacts: true
  script:
    - ":"
  pages:
    publish: build
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

