[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[project]
name = "notebooks"
version = "0.1.0"
description = "Marco Notebooks"
authors = [{ name = "Marco Ramos", email = "notebooks@marcoramos.me" }]
classifiers = [
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["notebooks"]
license = "GPL-3.0-or-later"
license-files = [
    "LICENSE",
]
dependencies = [
    "mkdocs-awesome-pages-plugin>=2.10.1",
    "mkdocs-jupyter>=0.25.1",
    "mkdocs-material>=9.7.0",
    "mkdocs-minify-plugin>=0.8.0",
]

[project.urls]
homepage = "https://gitlab.com/majramos/notebook"
issues = "https://gitlab.com/majramos/notebook/-/issues"
changelog = "https://gitlab.com/majramos/notebook/-/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "python-dotenv>=1.2.1",
]
notebooks = [
    "bokeh>=3.8.1",
    "boto3>=1.40.76",
    "cryptography>=46.0.3",
    "cython>=3.2.1",
    "folium>=0.20.0",
    "geopandas>=1.1.1",
    "matplotlib>=3.10.7",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "psutil>=7.1.3",
    "pyarrow>=22.0.0",
    "requests>=2.32.5",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.3",
    "shapely>=2.1.2",
    "statsmodels>=0.14.5",
    "yellowbrick>=1.5",
    "yfinance>=0.2.66",
]
