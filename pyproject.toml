[project]
name = "notebook"
version = "0.1.0"
description = "Marco notebooks about programming and data"
readme = "README.md"
authors = [
    { name = "Marco Ramos", email = "notebook@marcoramos.me" }
]
requires-python = ">=3.13"
dependencies = [
    "mkdocs-awesome-pages-plugin>=2.10.1",
    "mkdocs-jupyter>=0.27.0",
    "mkdocs-material>=9.8.0",
    "mkdocs-minify-plugin>=0.8.0",
]

[project.scripts]
notebook = "notebook:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
]
